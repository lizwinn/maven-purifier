# SPDX-License-Identifier: MIT
#
# Runs the flake checks, evaluates them for every system, and exercises
# the two parts of maven-purifier that need the network or a Nix
# installation, which the Nix sandbox has neither of: the lock run and the
# interactive mode.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Run the flake checks
        run: nix flake check --print-build-logs

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Evaluate the checks of every system
        run: nix flake check --no-build --all-systems

  lock-and-interactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the command
        run: nix build --out-link "$RUNNER_TEMP/cli" '.#cli'
      - name: Lock a copy of the wrapper fixture again
        run: |
          cp -r tests/fixtures/wrapper "$RUNNER_TEMP/wrapper"
          cd "$RUNNER_TEMP/wrapper"
          "$RUNNER_TEMP/cli/bin/maven-purifier" lock --force
          # The lock run of this checkout must record the downloads and
          # modules of the committed lock.
          nix shell 'nixpkgs#jq' -c sh -c '
            jq -S "{artifacts, projects, maven}" maven-purifier.lock.json > relocked.json
            jq -S "{artifacts, projects, maven}" "$GITHUB_WORKSPACE/tests/fixtures/wrapper/maven-purifier.lock.json" > committed.json
            diff -u committed.json relocked.json
          '
      - name: Run Maven offline from the lock of the multi fixture
        run: |
          cp -r tests/fixtures/multi "$RUNNER_TEMP/multi"
          cd "$RUNNER_TEMP/multi"
          "$RUNNER_TEMP/cli/bin/maven-purifier" mvn -B -ntp clean install
